name: E2E Browser Tests

on:
  push:
    branches: [main, feat/*, test/*]
    paths:
      - 'python/examples/adk-demo/**'
      - 'python/x402_a2a/**'
      - '.github/workflows/test-e2e-browser.yml'
  workflow_dispatch: # Allow manual trigger
  schedule:
    # Run daily at 2 AM UTC (optional - for regular validation)
    - cron: '0 2 * * *'

jobs:
  test-browser:
    name: Run Browser UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: python/examples/adk-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "python/examples/adk-demo/uv.lock"

      - name: Install dependencies
        run: |
          uv sync --group test

      - name: Install Playwright browsers
        run: |
          uv run python -m playwright install --with-deps chromium

      - name: Set up test environment
        run: |
          # Create .env.test from secrets and variables
          cat > tests/.env.test << EOF
          # Nevermined Authentication (secrets)
          NVM_API_KEY_SERVER=${{ secrets.NVM_API_KEY_SERVER }}
          NVM_API_KEY_CLIENT=${{ secrets.NVM_API_KEY_CLIENT }}

          # Nevermined Configuration (variables)
          NVM_ENVIRONMENT=${{ vars.NVM_ENVIRONMENT || 'sandbox' }}
          NVM_CREDITS_PLAN_ID=${{ vars.NVM_CREDITS_PLAN_ID }}
          NVM_PAYASYOUGO_PLAN_ID=${{ vars.NVM_PAYASYOUGO_PLAN_ID }}
          NVM_AGENT_ID=${{ vars.NVM_AGENT_ID }}

          # LLM Provider (secrets)
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}

          # Test Configuration
          TEST_TIMEOUT=60
          TEST_BROWSER_HEADLESS=true
          EOF

      - name: Create test directories
        run: |
          mkdir -p tests/logs tests/screenshots

      - name: Run Browser E2E Tests
        run: |
          uv run pytest tests/test_e2e_browser.py -v --tb=short --timeout=180 --junit-xml=test-results-browser.xml
        env:
          # Ensure tests use .env.test
          PYTEST_CURRENT_TEST: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            python/examples/adk-demo/test-results-browser.xml
            python/examples/adk-demo/tests/logs/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: python/examples/adk-demo/tests/screenshots/
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: python/examples/adk-demo/test-results-browser.xml
          check_name: Browser Test Results

      - name: Comment PR with screenshot links
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const screenshotDir = 'python/examples/adk-demo/tests/screenshots';
            let comment = '## 🖼️ Browser Test Screenshots\n\n';

            try {
              const files = fs.readdirSync(screenshotDir);
              const screenshots = files.filter(f => f.endsWith('.png'));

              if (screenshots.length > 0) {
                comment += `Found ${screenshots.length} screenshot(s). Download the \`browser-screenshots\` artifact to view.\n\n`;
                comment += 'Key screenshots:\n';
                screenshots.slice(0, 5).forEach(file => {
                  comment += `- ${file}\n`;
                });
                if (screenshots.length > 5) {
                  comment += `- ... and ${screenshots.length - 5} more\n`;
                }
              } else {
                comment += 'No screenshots were generated.\n';
              }
            } catch (error) {
              comment += `Could not read screenshots: ${error.message}\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
