name: E2E HTTP Tests

on:
  push:
    branches: [main, feat/*, test/*]
    paths:
      - 'python/examples/adk-demo/**'
      - 'python/x402_a2a/**'
      - '.github/workflows/test-e2e-http.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  test-http:
    name: Run HTTP/A2A Protocol Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Nevermined Authentication (from secrets)
      NVM_API_KEY_SERVER: ${{ secrets.NVM_API_KEY_SERVER }}
      NVM_API_KEY_CLIENT: ${{ secrets.NVM_API_KEY_CLIENT }}
      # Nevermined Configuration (hardcoded - not sensitive)
      NVM_ENVIRONMENT: staging_sandbox
      NVM_CREDITS_PLAN_ID: '108049205517037458937731288202562272535839301659429499119214601955897885058399'
      NVM_PAYASYOUGO_PLAN_ID: '62394875242609859677277111792165973450905709107028029787650786307704351020504'
      NVM_AGENT_ID: '2494368510178916230703135426153690490133277298381571617383167590258071002716'
      # LLM Configuration (hardcoded + secrets)
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    defaults:
      run:
        working-directory: python/examples/adk-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "python/examples/adk-demo/uv.lock"

      - name: Install dependencies
        run: |
          uv sync --group test

      - name: Create test directories
        run: |
          mkdir -p tests/logs tests/screenshots

      - name: Verify environment variables
        run: |
          echo "Checking environment variables..."
          env | grep -E "NVM_|OPENAI_|LLM_" || echo "No matching env vars found"

      - name: Run HTTP E2E Tests
        run: |
          uv run pytest tests/test_e2e_http.py -v --tb=short --junit-xml=test-results-http.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-test-results
          path: |
            python/examples/adk-demo/test-results-http.xml
            python/examples/adk-demo/tests/logs/
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: python/examples/adk-demo/test-results-http.xml
          check_name: HTTP Test Results
